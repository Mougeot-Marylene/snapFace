<!-- technique du spring interpolation qui permet d'insérer les valeurs des propriétées de la classe dans le DOM (template => fichier HTML) -->
<div class="face-snap-card" [ngClass]="{snapped: userHasSnapped}">

  <h2>{{ faceSnap.title }}</h2>

  <!-- utilisation du CONTROL FLOW BLOCK -->
  @if (faceSnap.location){
  <p>Localisation : {{faceSnap.location}}</p>
  }@else{
  <p>Localisation non spécifiée</p>
  }
  <!-- [src]="imageUrl" ==> C’est du property binding Angular . l'attribut binding(liaison par attribut src)  -->
  <img [src]="faceSnap.imageUrl" [alt]="faceSnap.title">

  <p>FaceSnap créée le {{ faceSnap.createdAt }}</p>

  <p>
    <!-- 
      (click)="" => c'est la liaison par evenement (event binding) pour lier à l'evenement du click sur ce bouton grace à al methode onAddSnap
        
      // la couleur verte change selon le nombre de snap 
    -->
    <button (click)="onSnap()">{{snapButtonText}}</button>
    <span [ngStyle]="{color: 'rgb(0,' + faceSnap.snaps +',0)'}"> 🤌 {{ faceSnap.snaps }}</span> 
  </p>

</div>
